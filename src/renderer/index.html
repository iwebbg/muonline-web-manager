<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>MuOnline Web Manager - Powered by InterWeb Ltd.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside>
    <div class="brand"><span class="mark">MU</span><strong>MuOnline Web <small>Powered by InterWeb Ltd.</small></strong></div>
    <nav data-i18n-label="navLabel" aria-label="Main navigation">
      <button data-page="overview" class="selected" data-i18n="navOverview">◎  Control panel</button>
      <button data-page="install" data-i18n="navInstall">↳  First installation</button>
      <button data-page="access" data-i18n="navAccess">◈  Access and SSL</button>
      <button data-page="site" data-i18n="navSite">⚙  Website settings</button>
      <button data-page="admins" data-i18n="navAdmins">♙  Web administrators</button>
      <button data-page="sql" data-i18n="navSql">◇  SQL Troubleshooting</button>
      <button data-page="backup" data-i18n="navBackup">▤  Backup</button>
      <button data-page="updates" data-i18n="navUpdates">↑  Updates</button>
      <button data-page="support" data-i18n="navSupport">?  Help &amp; Support</button>
    </nav>
    <p class="aside-note">© <span id="copyrightYear"></span> <a href="https://interweb.bg">InterWeb Ltd</a></p>
  </aside>
  <main aria-busy="true">
    <header><div class="header-tools"><label class="language-picker"><span data-i18n="language">Language</span><select id="language" aria-label="Language"><option value="en">English</option><option value="bg">Български</option></select></label><span class="badge" id="activity">Ready</span></div></header>
    <button id="updateNotice" type="button" class="update-notice" hidden></button>
    <p id="devNotice" class="warning" hidden></p>
    <p id="setupNotice" class="hint" aria-live="polite" hidden></p>
    <div id="content"></div>
    <section class="console" data-i18n-label="operationResult" aria-label="Operation result"><div class="console-heading"><span data-i18n="operations">OPERATIONS</span> <span id="operation"></span></div><pre id="output" aria-live="polite" tabindex="-1">Welcome. Start by checking prerequisites and signed releases.</pre></section>
  </main>
  <footer><strong data-i18n="donateTitle">Support MuOnline Web</strong><span data-i18n="donateHint">Your support keeps development going.</span><a href="https://buymeacoffee.com/interweb.bg">Buy Me a Coffee ↗</a><a href="https://ko-fi.com/interwebltd">Ko-fi ↗</a><a href="https://paypal.me/interwebltd">PayPal ↗</a></footer>
  <dialog id="operationProgress" class="operation-progress" aria-labelledby="progressTitle" aria-describedby="progressHint" tabindex="-1">
    <div class="progress-card">
      <div class="progress-spinner" aria-hidden="true"></div>
      <h1 id="progressTitle"></h1>
      <p id="progressHint" class="hint"></p>
      <div class="progress-current" role="status" aria-live="polite" aria-atomic="true"><span class="progress-dot" aria-hidden="true"></span><span id="progressStep"></span></div>
      <p id="installationEstimate" class="hint" hidden></p>
      <p id="progressElapsed" class="hint"></p>
    </div>
  </dialog>
  <dialog id="installationOutcome" class="operation-progress installation-outcome" aria-labelledby="outcomeTitle" aria-describedby="outcomeDescription">
    <div class="progress-card outcome-card">
      <button type="button" id="outcomeClose" class="outcome-close" data-close-outcome aria-label="Close">×</button>
      <div id="outcomeIcon" class="outcome-icon" aria-hidden="true"></div>
      <h1 id="outcomeTitle"></h1>
      <p id="outcomeDescription"></p>
      <button type="button" id="outcomeContinue" class="primary" data-close-outcome></button>
    </div>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
