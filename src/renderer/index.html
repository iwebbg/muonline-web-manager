<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>MuOnline Web Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside>
    <div class="brand"><span class="mark">MU</span><strong>MuOnline <small>WEB MANAGER</small></strong></div>
    <div class="workspace">WINDOWS / WSL2</div>
    <nav data-i18n-label="navLabel" aria-label="Main navigation">
      <button data-page="overview" class="selected" data-i18n="navOverview">◎  Control panel</button>
      <button data-page="install" data-i18n="navInstall">↳  First installation</button>
      <button data-page="access" data-i18n="navAccess">◈  Access and SSL</button>
      <button data-page="admins" data-i18n="navAdmins">♙  Web administrators</button>
      <button data-page="sql" data-i18n="navSql">◇  SQL Troubleshooting</button>
      <button data-page="backup" data-i18n="navBackup">▤  Backup</button>
      <button data-page="updates" data-i18n="navUpdates">↑  Updates</button>
    </nav>
    <p class="aside-note" data-i18n="asideNote">The Linux stack runs independently of the control panel.</p>
  </aside>
  <main>
    <header><span class="eyebrow">INTERWEB / MUONLINE WEB</span><div class="header-tools"><label class="language-picker"><span data-i18n="language">Language</span><select id="language" aria-label="Language"><option value="en">English</option><option value="bg">Български</option></select></label><span class="badge" id="activity">Ready</span></div></header>
    <button id="updateNotice" type="button" class="update-notice" hidden></button>
    <div id="content"></div>
    <section class="console" data-i18n-label="operationResult" aria-label="Operation result"><div class="console-heading"><span data-i18n="operations">OPERATIONS</span> <span id="operation"></span></div><pre id="output" aria-live="polite">Welcome. Start by checking prerequisites and signed releases.</pre></section>
  </main>
  <footer><strong data-i18n="donateTitle">Support MuOnline Web</strong><span data-i18n="donateHint">Your support keeps development going.</span><a href="https://buymeacoffee.com/interweb.bg">Buy Me a Coffee ↗</a><a href="https://ko-fi.com/interwebltd">Ko-fi ↗</a><a href="https://paypal.me/interwebltd">PayPal ↗</a></footer>
  <script type="module" src="app.js"></script>
</body>
</html>
